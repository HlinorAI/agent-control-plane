name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Validate fuzz payloads
        run: |
          go run ./cmd/fuzzpayloadcheck \
            -root internal/runtimefuzz/testdata/fuzz \
            -max-bytes 262144 \
            -allow-adversarial \
            > fuzz-payload-validation.json

      - name: Run full tests
        run: go test ./... -count=1

      - name: Run race tests
        run: go test -race ./...

      - name: Run vet
        run: go vet ./...

      - name: Run tool-call fuzz gate
        run: go test ./internal/runtimefuzz -fuzz '^FuzzToolCallArguments$' -fuzztime=15m -count=1

      - name: Run MCP metadata fuzz gate
        run: go test ./internal/runtimefuzz -fuzz '^FuzzMCPMetadata$' -fuzztime=15m -count=1

      - name: Build and publish release artifacts
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
