name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify formatting
        shell: bash
        run: test -z "$(gofmt -l .)"

      - name: Run tests
        run: go test ./...

      - name: Run adversarial regression corpus
        run: go test ./internal/adversarial -run TestAdversarialCorpus -count=1 -v

      - name: Run vet
        run: go vet ./...

      - name: Build CLI
        run: go build ./cmd/agentctl

      - name: Scan repository
        run: go run ./cmd/agentctl scan . --format sarif --fail-on high --output agentctl.sarif

      - name: Upload SARIF results
        if: ${{ always() && hashFiles('agentctl.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: agentctl.sarif
