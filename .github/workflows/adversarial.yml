name: Adversarial Regression

on:
  pull_request:
    paths:
      - "cmd/**"
      - "internal/scan/**"
      - "internal/config/**"
      - "internal/adversarial/**"
      - "testdata/adversarial/**"
      - ".github/workflows/adversarial.yml"
  push:
    branches: [main]
    paths:
      - "cmd/**"
      - "internal/**"
      - "testdata/adversarial/**"
      - ".github/workflows/adversarial.yml"
  workflow_dispatch:

concurrency:
  group: adversarial-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast-corpus:
    name: Fast adversarial corpus
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify formatting
        run: test -z "$(gofmt -l .)"

      - name: Run tests
        run: go test ./...

      - name: Run adversarial regression corpus
        run: go test ./internal/adversarial -run TestAdversarialCorpus -count=1 -v

      - name: Run vet
        run: go vet ./...
